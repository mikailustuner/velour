[package]
name = "velour-ytm"
version = "0.1.0"
edition = "2024"
description = "Minimal YouTube Music (InnerTube) client and parsers used by Velour"
license = "GPL-3.0-or-later"
repository = "https://github.com/mikailustuner/velour"
publish = false

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
