[package]
name = "sonora"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
discord-rich-presence = "1.1.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_20"] }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
mpris-server = "0.11"
rand = "0.9"
relm4 = "0.11.0"
relm4-icons = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sonora-player = { version = "0.1.0", path = "../player" }
sonora-ytm = { version = "0.1.0", path = "../ytm" }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "fs", "process"] }

[build-dependencies]
relm4-icons-build = "0.11.0"
